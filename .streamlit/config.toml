# Look and feel for the outcomes dashboard (read by Streamlit locally and on Streamlit Community Cloud).
# A plain white page, cool greys and one blue; the charts in charts.py use the same values.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#16181d"
font = "sans-serif"
borderColor = "#e6e8ec"
showWidgetBorder = true
baseRadius = "small"

[client]
# Hide the developer menu (Deploy button, rerun, settings) from viewers.
toolbarMode = "viewer"

[server]
# Partner exports can be a few MB; this is plenty.
maxUploadSize = 50
